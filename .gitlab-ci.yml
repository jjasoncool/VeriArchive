# CI per HANDOFF R-120 on GitLab (decision 0012): Windows (MSYS2 UCRT64),
# Ubuntu 24.04 and Fedora. Every job configures, builds and runs the tests.

stages:
  - build

.linux_build: &linux_build
  stage: build
  script:
    - cmake --preset linux-release
    - cmake --build --preset linux-release
    # What the runner shows of its disks: identity matching depends on it, and
    # containers often lack the udev database and /dev/disk links.
    - build/linux-release/veriarchive-cli --lang en media list || true
    - grep " $CI_PROJECT_DIR\| /builds" /proc/self/mountinfo || true
    - ls /run/udev/data /dev/disk 2>&1 | head -5 || true
    - ctest --preset linux-release --output-on-failure
    # R-122: forbidden constructs in src/core and src/common.
    - "! grep -rnE 'current_path\\(\\)|\\.string\\(\\)|<windows\\.h>|<libudev\\.h>' src/core src/common"

ubuntu-24.04:
  <<: *linux_build
  image: ubuntu:24.04
  # Keep the dependency lists for Ubuntu, Fedora and Windows in sync with
  # the Build sections of both READMEs.
  before_script:
    - apt-get update
    - >
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      build-essential cmake ninja-build pkg-config ca-certificates git
      libsqlite3-dev libssl-dev libglib2.0-dev libgtk-4-dev libadwaita-1-dev

fedora:
  <<: *linux_build
  image: fedora:41
  before_script:
    - >
      dnf install -y gcc-c++ cmake ninja-build pkgconf-pkg-config git
      sqlite-devel openssl-devel glib2-devel gtk4-devel libadwaita-devel

windows-ucrt64:
  stage: build
  tags:
    - saas-windows-medium-amd64
  variables:
    MSYSTEM: UCRT64
    CHERE_INVOKING: "1"
    # The CLI end-to-end test registers a folder through a drive letter made
    # with subst (decision 0027) only when asked to: the letter appears in the
    # logon session that runs it, which is this job's own here.
    VERIARCHIVE_TEST_SUBST: "1"
  before_script:
    - choco install msys2 -y --no-progress --params "/NoUpdate /InstallDir:C:\msys64"
    - >
      C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed
      mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-openssl
      mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita"
  script:
    # CTest includes veriarchive_package (R-121): the installed package must run
    # with only Windows on PATH and must not import msys-2.0.dll.
    - C:\msys64\usr\bin\bash.exe -lc "cmake --preset windows-ucrt64-release && cmake --build --preset windows-ucrt64-release && ctest --preset windows-ucrt64-release"
    - C:\msys64\usr\bin\bash.exe -lc "cd build/windows-ucrt64-release && cpack"
  artifacts:
    paths:
      - build/windows-ucrt64-release/VeriArchive-*.zip
